#        become: yes
      when: ansible_facts.distribution == "Ubuntu"

    - name: Check if check-filesystem-usage.ksh already exists
      stat: 
        path:  "{{workingdir.path}}/check-filesystem-usage.ksh"
      register: filesystem_stat
    
    - name: Copy check-filesystem-usage.ksh to VM and make it executable
      copy:
        src: ./check-filesystem-usage.ksh
        dest: "{{workingdir.path}}/check-filesystem-usage.ksh"
        mode: "0755"
      become: yes
      when: not filesystem_stat.stat.exists

    - name: Execute check-filesystem-usage.ksh
      shell: "{{workingdir.path}}/check-filesystem-usage.ksh"
      become: yes
      register: filesystem_usage_results

    - name: Display filesystem_usage_results
      debug:
        var: filesystem_usage_results.stdout

    - name: Mount points
      debug:
        msg: "{{ ansible_facts.mounts }}"

    - name: Root mount point freespace > 100MB
      assert:
        that: 
          -  item.size_available|int > ( 1024 * 1024 * 100 )
      loop: "{{ ansible_facts.mounts }}" 
      when: item.mount == '/'

    - name: Boot mount point freespace > 50MB
      assert:
        that: 
          -  item.size_available|int > ( 1024 * 1024 * 50 )
      loop: "{{ ansible_facts.mounts }}" 
      when: item.mount == '/boot'

    - name: Other mount point freespace > 10MB
      assert:
        that: 
          -  item.size_available|int > ( 1024 * 1024 * 10 )
      loop: "{{ ansible_facts.mounts }}" 
      when: 
        - item.mount != '/'
        - item.mount != '/boot'
        - item.device is not regex('^/dev/loop')
        - item.mount is not regex('^/sys')
        - item.mount is not regex('^/run')
        - item.fstype is not regex('^nfs')
        - item.fstype is not regex('^cifs')
        - item.fstype is not regex('^fuse')
        - item.fstype is not regex('^autofs')

    - name: Check partitions for crypt
      shell: "lsblk -o NAME,TYPE | grep crypt | wc -l"
      register: partition_crypts
      failed_when: partition_crypts.stdout | int != 0

#    - name: Check for encrypted devices
#      assert:
#        that:
#          - "'crypto' not in item.value.fs_type"
#      loop: "{{ ansible_facts.ohai_filesystem.by_device | dict2items }}"
#      when: item.value.fs_type is defined
#
#    - name: Check for encrypted devices another way
#      assert:
#        that:
#          - "'crypto' not in item.fstype"
#      loop: "{{ ansible_facts.mounts }}"

    - name: "Run Netbackup tool {{ inventory_hostname }}"
      shell: "/usr/openv/netbackup/bin/bpclimagelist -U -client {{ inventory_hostname }}"
      register: bpclimagelist
      become: yes
      ignore_errors: true

    - name: Check for Full and Incr Backups in NBU
      assert:
        that: 
          - "'Full Backup' in bpclimagelist.stdout"
          - "'Incr Backup' in bpclimagelist.stdout"
      when: bpclimagelist.rc == 0

    - name: Touch isBackedUp file
      file:
        path: "{{ workingdir.path }}/isBackedUp"
        state: touch
      when: bpclimagelist.rc == 0

    - name: Get osvmigration service account
      set_fact:
        osvmig_username: "{{ lookup('ansible.builtin.env', 'generic_username') }}"
        osvmig_password: "{{ lookup('ansible.builtin.env', 'generic_password') }}"
      no_log: true

    - name: Retrieve CloudView token
      uri:
        url: "https://cloudgateway.trusted.xyz.com:8443/cloudgateway/security/tokens"
        method: POST
        body_format: json
        body:
          username: "{{ osvmig_username }}"
          password: "{{ osvmig_password }}"
          onBehalfOf: "{{ job_run_user }}"
      register: cloudgateway_token_response
      until: cloudgateway_token_response.status == 200 or cloudgateway_token_response.status == 202
      retries: 10
      delay: 30
      delegate_to: 127.0.0.1
      no_log: false

    - name: Check CloudGateway token response
      assert:
        that: "'authToken' in cloudgateway_token_response.json"
        fail_msg: "Unexpected CloudGateway response: {{ cloudgateway_token_response }}"
      no_log: true

    - name: Extract CloudView token from response
      set_fact:
        cloudview_token: "{{ cloudgateway_token_response.json.authToken }}"
      no_log: true

    - name: Get status of VM in CMDB
      uri:
        url: "https://cloudgateway.trusted.xyz.com:8443/cloudgateway/asknow/ci-servers/host-name/{{ inventory_hostname_short }}"
        method: GET
        headers:
          Authorization: Bearer {{ cloudview_token }}
        status_code:
          - 200
          - 202
      register: cmdb_response
      until: cmdb_response.status == 200 or cmdb_response.status == 202
      retries: 10
      delay: 30
      delegate_to: 127.0.0.1
      no_log: true

    - name: Assert VM is not Decommissioning
      assert:
        that: cmdb_response.json.lifeCycleStatus != "Decommissioning"

    - name: Change Owner
      file:
        path: "{{ workingdir.path }}"
        owner: svcansible
        group: ansible
        recurse: yes
      become: yes

