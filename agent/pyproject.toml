[project]
name = "gadk-rhoai-agent"
version = "0.2.0"
description = "AI-powered VMware-to-OpenShift Virtualization migration agent built with Google ADK."
authors = [{ name = "Raghu Banda" }]
license = {text = "Apache License 2.0"}
readme = "../README.md"
requires-python = ">=3.11"

dependencies = [
    "google-adk>=1.0.0,<2.0.0",
    "litellm",
    "python-dotenv>=1.0.0,<2.0.0",
    "requests>=2.31.0",
    "kubernetes>=29.0.0",
    "tenacity>=8.2.0",
]

[dependency-groups]
dev = [
    "google-adk[eval]>=1.0.0",
    "pytest-asyncio>=0.26.0",
    "pytest>=8.3.5",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
