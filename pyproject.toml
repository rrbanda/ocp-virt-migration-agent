[project]
name = "ocp-virt-migration-agent"
version = "0.2.0"
description = "AI-powered VMware-to-OpenShift Virtualization migration agent built with Google ADK."
authors = [{ name = "Raghu Banda" }]
license = {text = "Apache License 2.0"}
requires-python = ">=3.11"

dependencies = [
    "google-adk[extensions]>=2.0.0,<3.0.0",
    "litellm>=1.84.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "requests>=2.31.0",
    "kubernetes>=29.0.0",
    "tenacity>=8.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
tracing = [
    "mlflow>=3.10.0",
]
test = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "google-adk[eval]>=2.0.0",
    "pytest-asyncio>=0.26.0",
    "pytest>=8.3.5",
    "ruff>=0.8.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
