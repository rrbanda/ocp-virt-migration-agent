apiVersion: v1
kind: ConfigMap
metadata:
  name: ocp-virt-migration-agent-startup
  labels:
    app.kubernetes.io/part-of: ocp-virt-migration-agent
data:
  startup.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    export HOME=/sandbox
    export PYTHONPATH=/sandbox
    export PATH="/opt/app-root/bin:/usr/local/bin:${PATH}"

    echo "=== OCP Virt Migration Agent startup ==="

    # Copy app code from image to workspace PVC (first run only)
    if [ ! -f /sandbox/app/__init__.py ]; then
      echo "Copying app code to workspace..."
      cp -a /opt/app-root/src/app /sandbox/app 2>/dev/null || cp -a /sandbox/app /sandbox/app 2>/dev/null || true
    fi

    # Copy skills from image to workspace
    if [ -d /skills ] && [ "$(ls -A /skills 2>/dev/null)" ]; then
      echo "Copying skills to workspace..."
      mkdir -p /sandbox/skills
      cp -a /skills/* /sandbox/skills/ 2>/dev/null || true
      echo "Skills: $(ls /sandbox/skills/ | wc -l) loaded"
    fi

    # Runtime overrides (sandbox controller ignores oc apply env changes)
    # Model: local MaaS premium endpoint with gemini-2.5-pro
    export OPENAI_API_BASE="https://maas.apps.ocp.qn6c5.sandbox1388.opentlc.com/v1"
    # MaaS Route uses cluster CA not in default trust store; disable for OpenAI SDK/LiteLLM
    export SSL_CERT_FILE=""
    export REQUESTS_CA_BUNDLE=""
    export CURL_CA_BUNDLE=""
    export LITELLM_SSL_VERIFY="false"
    export OPENAI_SSL_VERIFY="false"
    export ADK_MODEL="openai/gemini-2.5-pro"
    export ADK_MODEL_REASONING="openai/gemini-2.5-pro"
    export ADK_MODEL_FAST="openai/gemini-2.5-flash"
    export MIGRATION_DRY_RUN="false"

    echo "SKILLS_DIR=${SKILLS_DIR:-/sandbox/skills}"
    echo "ADK_MODEL=${ADK_MODEL}"
    echo "ADK_MODEL_REASONING=${ADK_MODEL_REASONING}"
    echo "ADK_MODEL_FAST=${ADK_MODEL_FAST}"
    echo "OPENAI_API_BASE=${OPENAI_API_BASE}"
    echo "AGENT_MODE=${AGENT_MODE:-pipeline}"
    echo "MIGRATION_DRY_RUN=${MIGRATION_DRY_RUN}"
    echo "MTV_API_URL=${MTV_API_URL:-in-cluster}"

    echo "=== Starting ADK Web (API + UI) on port ${PORT:-8080} ==="
    exec adk web \
      --host 0.0.0.0 \
      --port "${PORT:-8080}" \
      --allow_origins '*' \
      .
