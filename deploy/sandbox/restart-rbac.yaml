apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-pod-restart
  labels:
    app.kubernetes.io/part-of: ocp-virt-migration-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-pod-restart
  labels:
    app.kubernetes.io/part-of: ocp-virt-migration-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-pod-restart
subjects:
  - kind: ServiceAccount
    name: openshell-sandbox
