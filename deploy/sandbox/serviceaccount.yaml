apiVersion: v1
kind: ServiceAccount
metadata:
  name: openshell-sandbox
  labels:
    app.kubernetes.io/part-of: ocp-virt-migration-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ocp-virt-agent-openshell-privileged
  labels:
    app.kubernetes.io/part-of: ocp-virt-migration-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: openshell-sandbox
    namespace: ocp-virt-agent
