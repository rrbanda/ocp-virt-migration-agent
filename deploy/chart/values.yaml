replicaCount: 1

image:
  repository: ghcr.io/rrbanda/ocp-virt-migration-agent
  tag: "latest"
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

env:
  ADK_MODEL: ""
  OPENAI_API_BASE: ""
  AGENT_MODE: "pipeline"
  SKILLS_DIR: "/skills"
  MAX_LLM_CALLS: "200"
  MIGRATION_DRY_RUN: "true"
  DEFAULT_MTV_NAMESPACE: "mtv-user1"
  DEFAULT_VIRT_NAMESPACE: "vmimported-user1"
  MTV_OPERATOR_NAMESPACE: "openshift-mtv"
  TARGET_STORAGE_CLASS: ""
  COMPACTION_TOKEN_THRESHOLD: "8000"
  COMPACTION_EVENT_RETENTION: "5"
  MAX_MONITOR_POLLS: "30"
  DEFAULT_NETWORK_DESTINATION: "pod"

secrets:
  openaiApiKey: ""
  mtvApiToken: ""
  virtApiToken: ""
  aapToken: ""
  mlflowTrackingToken: ""

extraEnv: {}

service:
  port: 8000
  type: ClusterIP

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

openshift:
  route:
    enabled: true
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect

healthCheck:
  path: /list-apps
  livenessInitialDelay: 30
  livenessPeriod: 30
  livenessTimeout: 5
  readinessInitialDelay: 15
  readinessPeriod: 10
  readinessTimeout: 3

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

volumes: []
volumeMounts: []
