{{- $hasSecrets := or .Values.secrets.openaiApiKey .Values.secrets.mtvApiToken .Values.secrets.virtApiToken .Values.secrets.aapToken .Values.secrets.mlflowTrackingToken }}
{{- if $hasSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent.fullname" . }}-secret
  labels:
    {{- include "agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.openaiApiKey }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.mtvApiToken }}
  mtv-api-token: {{ .Values.secrets.mtvApiToken | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.virtApiToken }}
  virt-api-token: {{ .Values.secrets.virtApiToken | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.aapToken }}
  aap-token: {{ .Values.secrets.aapToken | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.mlflowTrackingToken }}
  mlflow-tracking-token: {{ .Values.secrets.mlflowTrackingToken | b64enc | quote }}
  {{- end }}
{{- end }}
