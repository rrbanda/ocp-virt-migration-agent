# gadk-rhoai OpenShift Deployment
#
# Deploy ADK Web UI + API Server with configurable skills on OpenShift.
#
# Before applying, update the placeholder values:
#   KEYCLOAK_HOST      - Your Keycloak hostname (or remove auth section for anonymous)
#   REALM_NAME         - Your Keycloak realm name
#   CLIENT_ID          - Your OIDC client ID
#   LLM_API_BASE       - Your LLM endpoint (Llama Stack, Ollama, vLLM, etc.)
#   ADK_MODEL_NAME     - Model identifier for your LLM provider
#
# Usage:
#   oc new-project adk-web
#   oc create secret docker-registry quay-pull-secret \
#     --docker-server=quay.io --docker-username=YOUR_USER --docker-password=YOUR_PASS
#   oc apply -f deploy/openshift.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: adk-web-config
  labels:
    app: adk-web
data:
  runtime-config.json: |
    {
      "backendUrl": "/api",
      "auth": {
        "enabled": true,
        "authority": "https://KEYCLOAK_HOST/realms/REALM_NAME",
        "clientId": "CLIENT_ID",
        "scopes": "openid profile email"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: adk-skills
  labels:
    app: adk-web
data:
  # Skills are baked into the agent image at /skills/ via Dockerfile.
  # This ConfigMap can override the agent instruction or add lightweight
  # skills. For the migration agent, all 10 skills and sample data are
  # in the image -- only the agent instruction is overridable here.
  agent-instruction.md: |
    You are the Migration Coordinator for VMware-to-OpenShift Virtualization migrations.

    ## Operating Modes

    ### Mode 1: With AAP (Live)
    When AAP is configured, trigger real Ansible job templates for pre-migration
    assessment and post-migration validation. Use `launch_job(template_id)` to run
    playbooks, poll with `get_job_status`, retrieve output with `get_job_output`,
    then analyze using skills.

    ### Mode 2: With Sample Data (Demo/Offline)
    When AAP is not available, or the user says "analyze the sample output":
    - Pre-migration: `load_skill_resource` with skill `pre-migration-analyzer`,
      resource `references/samples/pre-migration-playbook-output.txt`
    - Post-migration: `load_skill_resource` with skill `post-migration-validator`,
      resource `references/samples/post-migration-playbook-output.txt`

    ### Mode 3: User Pastes Output
    When the user pastes Ansible playbook output, analyze it using the
    `ansible-output-parser` skill and the appropriate analyzer/validator skill.

    ## Tools
    - `list_vmware_vms(namespace)` -- Discover VMware VMs via MTV inventory
    - `list_migrated_vms(namespace)` -- List VMs on OCP Virtualization
    - `get_vm_details(namespace, vm_name)` -- Detailed VM spec
    - `get_migration_status(namespace)` -- Check MTV migration progress
    - `create_migration_plan(namespace, vm_name)` -- Trigger migration
    - `get_pod_logs(namespace, pod_pattern)` -- Read pod logs
    - `list_job_templates()` / `launch_job()` / `get_job_status()` / `get_job_output()` -- AAP
    - `save_report_artifact(report_content, filename)` -- Save report as artifact

    ## Skills (load on demand)
    Use `list_skills` to discover skills, `load_skill` to activate them.
    Key skills: ansible-output-parser, pre-migration-analyzer, post-migration-validator,
    assessment-report-generator, completion-report-generator, mtv-log-analyzer,
    capacity-analyzer, risk-assessor, batch-planner, migration-workflow.

    ## Analyzing Playbook Output
    1. Load `ansible-output-parser` to parse the raw output
    2. Read the appropriate task map via `load_skill_resource`
    3. Load the analyzer or validator skill for evaluation criteria
    4. Load `assessment-report-generator` for report formatting
    5. Save with `save_report_artifact`

    Always explain what you are doing. Produce structured, actionable output.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adk-web
  labels:
    app: adk-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adk-web
  template:
    metadata:
      labels:
        app: adk-web
    spec:
      imagePullSecrets:
        - name: quay-pull-secret
      initContainers:
        - name: setup-skills
          image: busybox
          command: ['sh', '-c']
          args:
            - |
              cd /skills-raw
              for f in *.md; do
                case "$f" in
                  agent-instruction.md) cp "$f" /skills/agent-instruction.md ;;
                  *--*)
                    dir=$(echo "$f" | sed 's/\.md$//' | sed 's/--/\//g')
                    dir=$(dirname "$dir")
                    filename=$(basename "$(echo "$f" | sed 's/\.md$//' | sed 's/--/\//g')").md
                    mkdir -p "/skills/$dir"
                    cp "$f" "/skills/$dir/$filename"
                    ;;
                esac
              done
              echo "Skills directory structure:"
              find /skills -type f
          volumeMounts:
            - name: skills-raw
              mountPath: /skills-raw
            - name: skills-dir
              mountPath: /skills
      containers:
        - name: adk-web
          image: quay.io/rbrhssa/adk-web:oidc
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: web-config
              mountPath: /usr/share/nginx/html/assets/config/runtime-config.json
              subPath: runtime-config.json
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
        # ADK Agent API server -- migration coordinator with multi-cluster support.
        #
        # Multi-cluster tokens:
        #   oc create secret generic mtv-cluster-token --from-literal=token=<TOKEN> -n adk-web
        #   oc create secret generic virt-cluster-token --from-literal=token=<TOKEN> -n adk-web
        #   oc create secret generic aap-agent-token --from-literal=token=<TOKEN> -n adk-web
        #
        # When MTV_API_URL is empty, the agent uses in-cluster auth (single-cluster mode).
        - name: adk-api
          image: quay.io/rbrhssa/adk-agent:migration
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: api
          env:
            # -- LLM provider --
            - name: OPENAI_API_BASE
              value: "https://LLM_API_BASE/v1"
            - name: OPENAI_API_KEY
              value: "not-needed"
            - name: ADK_MODEL
              value: "ADK_MODEL_NAME"
            # -- Agent config --
            - name: SKILLS_DIR
              value: "/skills"
            - name: AGENT_NAME
              value: "migration_coordinator"
            - name: AGENT_DESC
              value: "VMware-to-OCP Virt migration coordinator with automated pipeline."
            - name: AGENT_MODE
              value: "pipeline"
            - name: MONITOR_MAX_ITERATIONS
              value: "20"
            - name: MONITOR_POLL_INTERVAL
              value: "15"
            # -- MTV cluster connection (empty = in-cluster) --
            - name: MTV_API_URL
              value: ""
            - name: MTV_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mtv-cluster-token
                  key: token
                  optional: true
            # -- OCP Virt cluster (empty = same as MTV) --
            - name: VIRT_API_URL
              value: ""
            - name: VIRT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: virt-cluster-token
                  key: token
                  optional: true
            # -- MTV inventory (empty = auto-discover from Route) --
            - name: MTV_INVENTORY_URL
              value: ""
            - name: MTV_INVENTORY_TOKEN
              value: ""
            # -- Configurable namespace / storage defaults --
            - name: DEFAULT_MTV_NAMESPACE
              value: "mtv-user1"
            - name: DEFAULT_VIRT_NAMESPACE
              value: "vmimported-user1"
            - name: MTV_OPERATOR_NAMESPACE
              value: "openshift-mtv"
            - name: TARGET_STORAGE_CLASS
              value: ""  # Set to your cluster's storage class (e.g. ocs-storagecluster-ceph-rbd)
            # -- AAP job template IDs for pipeline automation --
            - name: PRE_MIGRATION_TEMPLATE_ID
              value: ""
            - name: POST_MIGRATION_TEMPLATE_ID
              value: ""
            # -- AAP connection (token from Secret) --
            - name: AAP_URL
              value: ""
            - name: AAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aap-agent-token
                  key: token
                  optional: true
            - name: AAP_CA_BUNDLE
              value: ""
          volumeMounts:
            - name: skills-dir
              mountPath: /skills
              readOnly: true
            - name: artifact-storage
              mountPath: /app/.adk
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /list-apps
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: web-config
          configMap:
            name: adk-web-config
        - name: skills-raw
          configMap:
            name: adk-skills
        - name: skills-dir
          emptyDir: {}
        - name: artifact-storage
          persistentVolumeClaim:
            claimName: adk-artifacts
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adk-artifacts
  labels:
    app: adk-web
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: adk-web
  labels:
    app: adk-web
spec:
  selector:
    app: adk-web
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: adk-web
  labels:
    app: adk-web
spec:
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: adk-web
    weight: 100
  port:
    targetPort: http
