apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ocp-virt-migration-agent
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: ocp-virt-migration-agent
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rrbanda/ocp-virt-migration-agent.git
    targetRevision: main
    path: deploy/sandbox
  destination:
    server: https://kubernetes.default.svc
    namespace: ocp-virt-agent
  ignoreDifferences:
    - group: ""
      kind: ServiceAccount
      jsonPointers:
        - /imagePullSecrets
        - /secrets
    - group: route.openshift.io
      kind: Route
      jsonPointers:
        - /spec/host
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
